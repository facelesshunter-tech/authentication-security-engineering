site_name: Authentication Security Engineering
site_description: A practitioner's course on authentication security, written from the perspective of a senior application security engineer and bug bounty hunter.
site_url: https://facelesshunter-tech.github.io/authentication-security-engineering/
repo_url: https://github.com/facelesshunter-tech/authentication-security-engineering
repo_name: facelesshunter-tech/authentication-security-engineering
edit_uri: edit/main/

docs_dir: docs
site_dir: site
use_directory_urls: false

theme:
  name: material
  palette:
    scheme: forest
    primary: custom
    accent: custom
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - toc:
      permalink: true

plugins:
  - search

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/tts.js

nav:
  - Home: index.md
  - Phase 1 - Password Storage and Credential Attacks: phases/phase-01-password-storage-and-credential-attacks.md
  - Phase 2 - Password Change and Account Recovery: phases/phase-02-password-change-and-account-recovery.md
  - Phase 3 - Multifactor Authentication (MFA) Attacks: phases/phase-03-multifactor-authentication-mfa-attacks.md
  - Phase 4 - MFA Enrollment and Recovery Vulnerabilities: phases/phase-04-mfa-enrollment-and-recovery-vulnerabilities.md
  - Phase 5 - Passkeys, WebAuthn, and FIDO2: phases/phase-05-passkeys-webauthn-and-fido2.md
  - Phase 6 - Cookie and Session Security: phases/phase-06-cookie-and-session-security.md
  - Phase 7 - OAuth 2.0 and OpenID Connect Security: phases/phase-07-oauth-2-0-and-openid-connect-security.md
  - Phase 8 - Account Lifecycle and Identity Proofing: phases/phase-08-account-lifecycle-and-identity-proofing.md
  - Phase 9 - Reauthentication and Step-Up Authentication: phases/phase-09-reauthentication-and-step-up-authentication.md
  - Phase 10 - SAML Security: phases/phase-10-saml-security.md
  - Phase 11 - Multi-Tenant Identity Isolation: phases/phase-11-multi-tenant-identity-isolation.md
  - Phase 12 - Authentication Information Leakage: phases/phase-12-authentication-information-leakage.md
  - Phase 13 - Legacy Authentication Security: phases/phase-13-legacy-authentication-security.md
  - Phase 14 - Federated Logout and Identity Persistence: phases/phase-14-federated-logout-and-identity-persistence.md
  - Phase 15 - Authentication Logging and Monitoring: phases/phase-15-authentication-logging-and-monitoring.md
  - Phase 16 - Authentication Cryptographic Failures: phases/phase-16-authentication-cryptographic-failures.md
  - Phase 17 - Authentication-Adjacent Authorization Flaws: phases/phase-17-authentication-adjacent-authorization-flaws.md
